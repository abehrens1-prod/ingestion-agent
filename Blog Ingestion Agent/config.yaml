contentstack:
  content_type_uid: "blog_post"
  # URL prefix prepended to every generated slug. Must be /blog (no /software) — CMS strips /software.
  url_prefix: "/blog"
  # _content_type_uid value used for author reference fields.
  author_content_type_uid: "blog_author"
  # Confirmed field UIDs from exported Blog Post entry.
  field_map:
    title: "title"
    url: "url"
    author: "author"
    publish_date: "publish_date"
    lead_paragraph: "lead_paragraph"
    content: "content"
    seo: "seo"
    taxonomy: "taxonomies"

  # Author reference lookup: map author display name → Contentstack author entry UID.
  # Get UIDs from Contentstack CMS → Entries → Authors content type.
  # Add one line per known author: "Display Name": "bltXXXXXXXXXXXX"
  # Author reference lookup: map author display name → Contentstack author entry UID.
  # UIDs look like "bltXXXXXXXXXXXXXXXX" — get from Contentstack CMS → Content → Authors,
  # click each author, and copy the Entry UID from the URL or sidebar.
