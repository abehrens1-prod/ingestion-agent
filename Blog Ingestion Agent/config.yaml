  # Locale codes live on the site (confirmed by Dale, ITS, 2026-08-26). Default is "en" —
  # do not hardcode "en" elsewhere once locale selection is wired up; read from this list.
  locales: ["en", "es", "fr", "de", "it", "ja", "ko", "pt", "pl", "zh", "th"]
  default_locale: "en"

  # Taxonomy configuration. taxonomy_uid and term_uids confirmed from live entry blt3cd0f47c06e1cf66.
  taxonomy_uid: "blog"
  taxonomy_terms:
    "Product Updates": "product_updates"
    "Mosaic": "mosaic"
    "Semantic Layer": "semantic_layer"
    "AI Trends": "ai_trends"
    "Analytics": "analytics"
    "Business Intelligence": "business_intelligence"

api:
  base_url: "https://api-stg.microstrategy.com/cs-software"
  # Assets endpoint for image upload. Dedicated blog-post assets folder endpoint,
  # provided by Dale (ITS), 2026-08-26. POST, multipart/form-data with a single
  # "body" field holding the file — not Contentstack's native asset[upload]/
  # asset[title]/asset[parent_uid] shape, since the folder is already baked in.
  # Leave blank to skip automatic asset upload (images will need manual UIDs).
  assets_url: "https://api-stg.microstrategy.com/cs-software/uploadToBlogAssetsFolder"

pipeline:
  run_claude_enrichment: false
  claude_model: "claude-sonnet-4-6"

parser_hints:
  # Number of paragraphs at the top to scan for author/date metadata
  metadata_in_first_n_paragraphs: 5
  # Keywords that indicate a CTA section heading
  cta_keywords:
    - "Get Started"
    - "Learn More"
    - "Contact Us"
    - "Request a Demo"
    - "Schedule a Call"
    - "Try"
    - "Download"
    - "Read the"
    - "Ready to"
  # Regex pattern matching FAQ heading text (case-insensitive)
  faq_heading_pattern: "(?i)frequently asked|\\bfaq\\b|questions"
  # Regex pattern matching CTA section heading (case-insensitive)
  cta_heading_pattern: "(?i)get started|learn more|contact us|ready to|request a|schedule|try it|sign up"
  # Minimum number of FAQ question signals before entering FAQ mode
  min_faq_questions: 1
  # Percentage of document (from bottom) to treat as potential CTA zone
  cta_zone_bottom_pct: 0.20
  # Percentage of document (from top) to treat as potential Quick Answer zone
  quick_answer_zone_top_pct: 0.30
  # Regex patterns for editorial metadata to strip from body
  editorial_banner_patterns:
    - "(?i)reviewed\\s*\\+\\s*optimized"
    - "(?i)for\\s+publish"
    - "(?i)seo:\\s*\\d+"
    - "(?i)schema markup.*for web team"
    - "(?i)web team only.*do not publish"
  # Regex for inline [WEB TEAM: ...] notes to strip from paragraph text
  inline_editorial_pattern: "\\[WEB TEAM:[^\\]]*\\]"
